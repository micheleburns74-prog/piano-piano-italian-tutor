/* Layout concept: a navy app bar with a scrolling tab strip, then one calm white-on-slate column. Lexend headings for reading fluency, Atkinson Hyperlegible for body text. */

  function defaults() { return { v: 1, unlocked: 1, cards: {}, sessions: [], days: {}, contentV: 2, knownMax: 0, glog: [], stages: {}, readStats: { n: 0, ok: 0 }, sounds: {}, prefs: { name: "", namePh: "", form: "f", setup: false, simple: false, tint: "none", size: 1, roomy: false, hc: false, rate: 0.85, timer: 10, remind: "09:00", remindDays: "daily" }, exam: { route: "", body: "", date: "", checks: {}, skills: {} }, voice: "", auto: true, updated: 0 }; }

  /* ---------- Saving: this device always, your account when available ---------- */
  var dbRef = null, writing = false, dirty = false, saveTimer = null;

  function withTimeout(p, ms) {

  async function initCloud() {
    try {

      var ref = db.collection("data/users/" + id).doc("progress");
      var snap = await withTimeout(ref.get(), 10000);

      if (snap && snap.exists) {
        var r = snap.data();

    }

  /* ---------- Dates ---------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

    var viaNet = function () { onlinePlay(c.it, "it", Math.max(0.55, Math.min(1, rate * 0.85)), function () {}, function () { window.__onlineBroken = true; toast("No sound? Turn the volume up and check the silent switch."); }); };
    try {
      if ((useOnline() || window.__plNoStart) && !window.__onlineBroken) { viaNet(); }
      else if ("speechSynthesis" in window) {
        var ss = window.speechSynthesis, began = false;
        try { unlockAudio(); } catch (e) {}
        try { ss.cancel(); } catch (e) {}
        setTimeout(function () {
          if (myGen !== speakGen || tok !== plState.token) return;
          try {
            var u = new SpeechSynthesisUtterance(c.it);
            u.lang = voice ? voice.lang : "it-IT"; if (voice) u.voice = voice; u.rate = rate; u.pitch = 1;
            u.onstart = function () { began = true; }; u.onboundary = function () { began = true; };
            try { ss.resume(); } catch (e) {}
            ss.speak(u);
          } catch (e) {}
          /* If the built-in voice never starts, use the online Italian voice for this and the next phrases. */
          setTimeout(function () {
            if (began || myGen !== speakGen || tok !== plState.token || window.__onlineBroken) return;
            window.__plNoStart = true; viaNet();
          }, 1800);
        }, 300);
      }
    } catch (e) {}
    /* Timing does not depend on the voice's own events (they are unreliable): say it once, give it plenty of time, then a pause to repeat. */
    var holdMs = 3000 + String(c.it).length * 220 + 3500;
    plAfter(tok, holdMs, function () {
      dayRec().heard++;
      persist();
      if (plState.i + 1 >= plState.list.length) { plStop(true); toast("Done. You heard all " + plState.list.length + " phrases."); render(); return; }
      plState.i++;
      plStep(tok);
    });
  }

  /* Memory tricks for every phrase */
  var hooksBusy = false;
  function hooksPanelHTML() {
    var open = unlockedCards(), mine = open.filter(function (c) { return S.cards[c.id] && S.cards[c.id].hook; }).length;
    return '<section class="panel"><h2>Memory tricks</h2><p class="lede">Every phrase comes with a starter memory trick: a picture or a sound-alike that helps it stick. Open a phrase and tap Write my own to replace it with yours.' + (mine ? " You have written " + mine + " of your own." : "") + "</p>" +
      (sampleFn ? '<div><button type="button" class="btn"' + (hooksBusy ? " disabled" : "") + ' data-act="hookall">Write tricks for the rest with Claude</button></div><p class="hint" id="hookAllMsg"></p>' : "") + "</section>";
  }
  async function genAllHooks() {
    if (hooksBusy) return;
    if (!sampleFn) { toast("Claude is not available here. Open a phrase and write your own."); return; }
    var todo = unlockedCards().filter(function (c) { return !(S.cards[c.id] && S.cards[c.id].hook); });
    if (!todo.length) { toast("Every open phrase already has a trick."); return; }
    hooksBusy = true;
    var msg = document.getElementById("hookAllMsg"), done = 0, i;
    try {
      for (i = 0; i < todo.length; i += 8) {
        var batch = todo.slice(i, i + 8);
        msg = document.getElementById("hookAllMsg");
        if (msg) msg.textContent = "Writing tricks... " + i + " of " + todo.length;
        var prompt = 'For each Italian phrase below, write one short memory trick (under 22 words, plain text, no quotation marks, no em dashes) that helps an English speaker remember it and say it. Use a sound-alike or a vivid picture. Reply with ONLY a JSON array like [{"id":"c1","trick":"..."}].\n' +
          batch.map(function (c) { return c.id + " | " + c.it + " | said " + c.ph + " | meaning " + c.en; }).join("\n");
        var res = await sampleFn([{ role: "user", content: prompt }], { cache: false });
        var m = String((res && res.text) || "").match(/\[[\s\S]*\]/), arr = m ? JSON.parse(m[0]) : [];
        arr.forEach(function (o) {
          if (o && BYID[o.id] && typeof o.trick === "string" && o.trick.trim()) {
            var sc = S.cards[o.id] || (S.cards[o.id] = { box: 0, due: "", seen: 0 });
            sc.hook = o.trick.replace(/["“”]/g, "").trim().slice(0, 220);
            done++;
          }
        });
        persist();
      }
    } catch (e) { toast("Claude could not finish. The tricks already written are saved. Try again."); }
    hooksBusy = false;
    render();
    if (done) toast("Wrote " + pl(done, "memory trick") + ".");
  }

  /* Check my speaking: the phone keyboard types what it heard, the page answers out loud */
  function sayCheck(id) {
    var c = BYID[id], box = document.getElementById("sayBox"), out = document.getElementById("sayOut");
    if (!c) return;
    var heard = box ? String(box.value || "").trim() : "";
    if (!heard) {
      if (out) { out.hidden = false; out.innerHTML = '<p class="hint"><strong>I did not get any words yet.</strong> Click the box, press the Control key twice, say the phrase, then press Control twice again to stop. When the words appear in the box, press Check. You can also type the phrase.</p>'; }
      var bx0 = document.getElementById("sayBox"); if (bx0) try { bx0.focus(); } catch (e) {}
      return;
    }
    var hw = normIt(heard).split(" ").map(stripAcc), bad = [];
    c.it.split(" ").forEach(function (w) {
      var a = stripAcc(normIt(w));
      if (a && !hw.some(function (h) { return nearWord(a, h); })) bad.push(w.replace(/[?!.,;:]/g, ""));
    });
    var sc = S.cards[id] || (S.cards[id] = { box: 0, due: "", seen: 0 });
    sc.said = (sc.said || 0) + 1;
    dayRec().said++;
    if (sess) sess.said = (sess.said || 0) + 1;
    persist();
    if (out) { out.hidden = false; out.innerHTML = '<p class="it sm" lang="it">' + diffBtnHTML(c.it, heard) + '</p><p class="hint"><strong>Tap any word to hear it.</strong> ' + (bad.length ? "Underlined words are worth hearing again. That is normal practice." : "That matched. Well done.") + " Your keyboard heard: " + esc(heard) + '</p><div class="row"><button type="button" class="btn" data-m="whole" data-id="' + id + '">Hear the whole phrase slowly</button></div>'; }
    stopEcho();
    var run = echoRun, fns = [];
    if (!bad.length) {
      fns.push(function (next) { speakEn("That matched. Well done.", next); });
      fns.push(function (next) { speak(c.it, baseRate(), next); });
    } else {
      fns.push(function (next) { speakEn(bad.length === 1 ? "Almost. Listen to this word." : "Almost. Listen to these words.", next); });
      bad.slice(0, 3).forEach(function (w) { fns.push(function (next) { speak(w, 0.55, next); }); });
      fns.push(function (next) { speakEn("Now the whole phrase.", next); });
      fns.push(function (next) { speak(c.it, Math.min(baseRate(), 0.75), next); });
      fns.push(function (next) { speakEn("Now try again.", next); });
    }
    runSeq(run, fns);
  }

  /* ---------- Tutor: asks Claude through the page's sample capability ---------- */
  var SPK_SM = SPK.replace('width="22" height="22"', 'width="16" height="16"');
  var CHIPS = [
    ["What should I work on today?", "Look at my progress and tell me what to focus on today. Keep it to three short points."],
    ["Role-play: citizenship office", "Role-play a short, friendly conversation at an Italian citizenship office. You are the clerk. Start with one simple line from the clerk and wait for my reply. After each reply of mine, correct me gently in one line, then continue."],
    ["Help with my hardest phrase", "Pick the phrase I find hardest and teach it to me slowly in small steps, with a memory trick."],
    ["Teach me more useful phrases", "Suggest five new useful everyday Italian phrases that I have not opened yet, each with a phonetic spelling and its meaning."],
    ["Give me example sentences", "Give me two short example sentences that use phrases I have already opened."]
  ];
  var TUTOR_RULES = [
    "You are a patient Italian tutor inside a practice app.",
    "The learner is learning Italian for her Italian citizenship (no exam), has a learning disability that affects pronunciation and memory, and learns slowly.",
    "Keep every answer under 120 words. Use plain text only: no markdown, no asterisks, no headings, and no em dashes.",
    "Put every Italian phrase you want the learner to hear inside double square brackets, like [[Buongiorno]]. Right after it, give a phonetic spelling in parentheses using English respelling with the stressed syllable in capitals, then the English meaning.",
    "Use at most 4 Italian phrases per answer, and prefer phrases from the learner's list.",
    "Be warm and encouraging and never rush. A soft R is fine. If the learner writes Italian, correct it gently in one short line.",
    "If asked for something unrelated to learning Italian, politely steer back."
  ].join(" ");
  var chat = [], draft = "", asking = false, sampleFn = null, tutorNote = "";

  function tutorContext() {
    var unl = unlockedCards();
    var hard = unl.filter(function (c) { var s = S.cards[c.id]; return s && s.box >= 1 && (s.last === "not" || s.last === "almost"); }).map(function (c) { return c.it; });
    var strong = unl.filter(function (c) { var s = S.cards[c.id]; return s && s.box >= 3; }).map(function (c) { return c.it; });
    return "Phrases opened so far: " + unl.map(function (c) { return c.it; }).join("; ") + ".\n" +
      "Phrases the learner finds hard: " + (hard.join("; ") || "none yet") + ".\n" +
      "Phrases the learner knows well: " + (strong.join("; ") || "none yet") + ".\n" +
      "Sessions completed: " + S.sessions.length + ". Times spoken aloud: " + totalSaid() + ".\n" +
      "Phrases the learner mixes up: " + mixText() + ".\n" + recapText();
  }
  function tutorText(t) {
    if (!t) return '<span class="hint">Thinking...</span>';
    return esc(t).replace(/\[\[(.+?)\]\]/g, function (m, p) {
      return '<button type="button" class="ibtn" data-act="say" data-t="' + p + '">' + SPK_SM + p + "</button>";
    }).replace(/\n/g, "<br>");
  }
  function coachLocalHTML() {
    var sh = shakyCards(), kn = knownCount();
    var h = '<section class="plain"><h1>Your coach</h1><p class="lede">What to work on next, with one tap to start. </p></section>';
    h += '<section class="panel"><h2>Work on this next</h2>';
    if (sh.length) {
      h += '<p class="hint">These phrases felt shaky. Tap one for a guided lesson.</p><ul class="rows">' + sh.map(function (c) {
        return '<li><span class="rit" lang="it">' + esc(c.it) + '</span><span class="ren">' + esc(c.en) + '</span><span class="pact"><button type="button" class="btn sm" data-act="listen" data-id="' + c.id + '">' + SPK_SM + ' Listen</button><button type="button" class="btn sm" data-act="sayopen" data-id="' + c.id + '">Record me</button> <button type="button" class="btn sm primary" data-act="glword" data-id="' + c.id + '">Guided lesson</button></span></li>';
      }).join("") + "</ul>";
    } else {
      var nx = glPickNext();
      h += '<p class="hint">Nothing is shaky right now. A good next word is below.</p><ul class="rows"><li><span class="rit" lang="it">' + esc(BYID[nx].it) + '</span><span class="ren">' + esc(BYID[nx].en) + '</span><span class="pact"><button type="button" class="btn sm primary" data-act="glword" data-id="' + nx + '">Guided lesson</button></span></li></ul>';
    }
    h += "</section>";
    h += '<section class="panel"><h2>Your plan</h2><ul class="plan">' + planLines().map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul></section>";
    if (S.unlocked < SETS.length) h += '<section class="panel"><h2>More phrases</h2><p class="hint">Next set: ' + esc(SETS[S.unlocked].title) + '. It also opens by itself once your current phrases feel solid.</p><div><button type="button" class="btn" data-act="unlock">Open it now</button></div></section>';
    return h;
  }
  function tutorHTML() {
    var h = coachLocalHTML();
    if (!sampleFn) return h;
    h += '<section class="plain"><h2>Ask Claude</h2><p class="lede">Ask anything, or pick one below. Tap a phrase in an answer to hear it.</p></section>';
    h += '<div class="chips">' + CHIPS.map(function (c, i) {
      return '<button type="button" class="chipbtn" data-act="chip" data-i="' + i + '"' + (asking ? " disabled" : "") + ">" + esc(c[0]) + "</button>";
    }).join("") + "</div>";
    if (chat.length) {
      h += '<div class="chat">' + chat.map(function (m) {
        var me = m.role === "user";
        return '<div class="msg ' + (me ? "me" : "tutor") + '"><span class="who">' + (me ? "You" : "Tutor") + '</span><div class="bub"' + (m.live ? ' id="live"' : "") + ">" +
          (me ? esc(m.shown || m.content).replace(/\n/g, "<br>") : tutorText(m.content)) + "</div></div>";
      }).join("") + "</div>";
    }
    if (tutorNote) h += '<p class="note" role="alert">' + esc(tutorNote) + "</p>";
    h += '<form class="ask" id="askForm"><label for="askBox">Your question or reply</label><textarea id="askBox" rows="3" placeholder="Type in English or Italian">' + esc(draft) + "</textarea>" +
      '<div class="row"><button type="submit" class="btn primary"' + (asking ? " disabled" : "") + ">Ask</button>" +
      (chat.length ? '<button type="button" class="btn" data-act="clearchat">Start over</button>' : "") + "</div></form>";
    return h;
  }
  async function askTutor(text, label) {
    text = (text || "").trim();
    if (!text || asking) return;
    if (!sampleFn) { toast("The tutor is not available in this view."); return; }
    tutorNote = "";
    chat.push({ role: "user", content: text, shown: label || text });
    chat.push({ role: "assistant", content: "", live: true });
    draft = "";
    asking = true;
    render();
    var hist = chat.filter(function (m) { return !m.live; }).slice(-12);
    while (hist.length && hist[0].role !== "user") hist.shift();
    var input = [
      { role: "user", content: TUTOR_RULES + "\n\n" + tutorContext() + "\n\nThe conversation follows." },
      { role: "assistant", content: "Understood. I will follow these rules." }
    ].concat(hist.map(function (m) { return { role: m.role, content: m.content }; }));
    try {
      var res = await sampleFn(input, {
        cache: false,
        onText: function (p) { var el = document.getElementById("live"); if (el) el.innerHTML = tutorText(p.text); }
      });
      chat.pop();
      chat.push({ role: "assistant", content: (res && res.text) || "" });
    } catch (e) {
      chat.pop();
      chat.pop();
      if (!label) draft = text;
      var code = e && e.code;
      tutorNote = code === "not_granted" ? "The tutor was not allowed to answer. Reload the page and choose Allow if you want it."
        : code === "rate_limited" ? "The tutor needs a short rest. Try again in a minute."
        : "The tutor could not answer just now. Try again in a moment.";
    }
    asking = false;
    render();
  }
  async function initTutor() {
    try {
      if (!window.claude || !window.claude.use) return;
      var sm = await window.claude.use("sample");
      if (sm) { sampleFn = sm; if (view === "tutor" && !asking) render(); }
    } catch (e) {}
  }
  app.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "askForm") {
      e.preventDefault();
      var box = document.getElementById("askBox");
      askTutor(box ? box.value : "");
    }
  });
  app.addEventListener("input", function (e) {
    if (e.target && e.target.id === "askBox") draft = e.target.value;
  });

  /* ---------- Start ---------- */
  refreshVoices();
  try {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = function () {
        refreshVoices();
        if (view === "today" && !sess && !doneEntry) render();
      };
    }
  } catch (e) {}
  setTimeout(function () { if (!voicesLoaded) { voicesLoaded = true; if (view === "today" && !sess && !doneEntry) render(); } }, 1500);
  if (!S.prefs.maleMig82) { S.prefs.maleMig82 = true; S.voice = ""; try { persist(); pickVoice(); } catch (e) {} }
  if (IS_IOS && !S.prefs.ovMig80) { S.prefs.ovMig80 = true; S.prefs.onlineVoice = false; try { persist(); } catch (e) {} }
  if (IS_IOS && !S.prefs.iosOptIn && S.prefs.check) { S.prefs.check = false; try { persist(); } catch (e) {} }
  applyPrefs();
  setInterval(tick, 1000);
  function checkUpdate() {
    try {
      if (!/^https?:$/.test(location.protocol)) return;
      fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
        var m = t.match(/var VERSION = "(\d+)"/);
        if (!m || !(Number(m[1]) > Number(VERSION)) || document.getElementById("updbar")) return;
        try { var fk = "pp-auto-" + m[1]; if (!sessionStorage.getItem(fk)) { sessionStorage.setItem(fk, "1"); window.location.replace(location.pathname + "?v=" + m[1] + "&r=" + Date.now() + location.hash); return; } } catch (e) {}
        var d = document.createElement("div"); d.id = "updbar"; d.setAttribute("role", "status");
        d.style.cssText = "background:#E8F0F8;color:#202D3B;border-bottom:2px solid #244B76;padding:12px 16px;font-weight:600;display:flex;gap:12px;align-items:center;flex-wrap:wrap";
        d.innerHTML = '<span>A newer version of Piano Piano is ready.</span><button type="button" style="min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#244B76;color:#fff;font-weight:700;font-size:1rem">Update now</button>';
        d.querySelector("button").addEventListener("click", function () { window.location.replace(location.pathname + "?v=" + m[1] + "&r=" + Date.now() + location.hash); });
        document.body.insertBefore(d, document.body.firstChild);
      }).catch(function () {});
    } catch (e) {}
  }
  route();
  checkUpdate();
  initCloud();
  initTutor();
})();
</script>
</body>
